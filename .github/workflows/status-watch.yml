name: Public service status watch

on:
  schedule:
    # Offset from the top of the hour to reduce schedule congestion.
    - cron: '7,22,37,52 * * * *'
    # Between full checks, poll only services with active incidents.
    - cron: '2,12,17,27,32,42,47,57 * * * *'
  workflow_dispatch:
    inputs:
      telegram_test:
        description: 'Send one clearly labelled Telegram delivery test'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: public-service-status-watch
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HC_PING_URL: ${{ secrets.HC_PING_URL }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check Telegram configuration
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in repository Actions secrets to enable monitoring."
          fi
      - name: Poll public status sources and notify
        env:
          MONITOR_ACTIVE_ONLY: ${{ github.event_name == 'schedule' && github.event.schedule == '2,12,17,27,32,42,47,57 * * * *' }}
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: python scripts/monitor.py
      - name: Verify Telegram delivery
        if: github.event_name == 'workflow_dispatch' && inputs.telegram_test && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import monitor; monitor.send('🧪 전송 테스트 · Status Watch\n알림 연결이 정상입니다. 실제 장애 알림이 아닙니다.')"
      - name: Commit status state
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- state.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state.json
            git commit -m 'Update service status state'
            git push
          fi
      - name: Signal successful run to Healthchecks.io
        if: success() && env.HC_PING_URL != ''
        run: curl --fail --silent --show-error --max-time 10 "$HC_PING_URL"
